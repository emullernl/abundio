[package]
name = "abundio"
version = "1.9.1"
description = "A GPU-accelerated terminal multiplexer with AI agent support"
authors = ["Emil Müller"]
edition = "2021"
license = "MIT OR Apache-2.0"

[lib]
name = "abundio_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
tauri-plugin-window-state = "2"
tauri-plugin-os = "2"
tauri-plugin-updater = "2"
portable-pty = "0.8"
# `backup` powers the one-time copy of the previous version's database into
# this data epoch (app_paths.rs) — a plain file copy would lose uncheckpointed
# WAL frames.
rusqlite = { version = "0.31", features = ["bundled", "backup"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }
dirs = "5"
dashmap = "6"
base64 = "0.22"
crossbeam-channel = "0.5"
thiserror = "2"
log = "0.4"
notify = "7"
# libgit2 bindings for in-process git operations. Used by the GitScheduler
# (see `git_scheduler.rs`) to avoid subprocess spawn overhead — each
# `git status` / `git diff` shell-out previously took ~200-500 ms on macOS,
# which kept the WKWebView's host process busy long enough to noticeably
# stall the JS main thread during a `git stash` burst. Using libgit2 cuts
# each operation to ~10-50 ms.
git2 = { version = "0.19", default-features = false, features = ["vendored-libgit2"] }
font-kit = "0.14"
ignore = "0.4"
regex = "1"
tiny_http = "0.12"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# System metrics (CPU + memory) for the status bar's app-usage readout.
# `app_metrics.rs` samples the whole Abundio process tree on a background
# thread and pushes an `app-metrics` event to the frontend. Only the `system`
# feature is needed (processes + CPU); disk/network/component are excluded.
sysinfo = { version = "0.33", default-features = false, features = ["system"] }
tauri-plugin-clipboard-manager = "2"
# Image decode + PNG re-encode for "Smart image drop" (see clipboard_image.rs).
# A dropped image of any supported raster format is decoded and placed on the OS
# clipboard as PNG so an agent ingests it via its Ctrl+V clipboard path.
image = { version = "0.25", default-features = false, features = [
    "png",
    "jpeg",
    "gif",
    "webp",
    "bmp",
    "tiff",
] }
# Cross-platform image-to-clipboard on Windows/Linux (macOS uses a native PNG
# path — see clipboard_image.rs). Already pulled in transitively by
# tauri-plugin-clipboard-manager; pinned here so the direct dependency is explicit.
arboard = "3"
# Secure temp-file creation (O_EXCL, 0600, RAII cleanup) for the macOS PNG
# clipboard path in clipboard_image.rs. Also used by tests.
tempfile = "3"
# Format-preserving edits to Kimi Code's user-owned ~/.kimi-code/config.toml —
# comments and layout must survive Abundio's [[hooks]] merge (agent_hooks.rs),
# and Kimi's strict loader rejects unknown keys so a serde rewrite is too risky.
# Already in the dependency tree transitively via the tauri toolchain.
toml_edit = "0.25"
# ── Per-Workspace encrypted environment variables (env_crypto.rs) ──
# A single 32-byte master key lives in the OS credential store; every variable
# VALUE is sealed with AES-256-GCM under it, so a copy of abundio.db alone is
# useless.
#
# keyring 4's `v1` feature selects exactly the three stores we want and no
# others (see keyring's Cargo.toml [features]):
#   apple-native-keyring-store/keychain   — macOS Keychain Services
#   windows-native-keyring-store          — Windows Credential Manager
#   zbus-secret-service-keyring-store     — Linux Secret Service over pure-Rust
#                                           zbus, so no libdbus/libsecret C
#                                           dependency is added to the Linux CI
#                                           image (build.yml installs only
#                                           webkit2gtk/appindicator/rsvg/patchelf)
# Deliberately NOT enabled:
#   dbus-secret-service-keyring-store — would drag in libdbus-sys
#   linux-keyutils-keyring-store      — the kernel keyring is session-scoped and
#                                       does not survive a reboot, which would
#                                       present to the user as silent key loss
# Do not list `apple-native-keyring-store` on its own here: that enables the
# crate without its `keychain` sub-feature and fails to compile on macOS.
keyring = { version = "4", default-features = false, features = ["v1"] }
aes-gcm = "0.10"
zeroize = { version = "1", features = ["zeroize_derive"] }
