[package]
name = "abundio"
version = "1.3.1"
description = "A GPU-accelerated terminal multiplexer with AI agent support"
authors = ["Emil Müller"]
edition = "2021"
license = "MIT OR Apache-2.0"

[lib]
name = "abundio_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
tauri-plugin-window-state = "2"
tauri-plugin-os = "2"
portable-pty = "0.8"
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }
dirs = "5"
dashmap = "6"
base64 = "0.22"
crossbeam-channel = "0.5"
thiserror = "2"
log = "0.4"
notify = "7"
# libgit2 bindings for in-process git operations. Used by the GitScheduler
# (see `git_scheduler.rs`) to avoid subprocess spawn overhead — each
# `git status` / `git diff` shell-out previously took ~200-500 ms on macOS,
# which kept the WKWebView's host process busy long enough to noticeably
# stall the JS main thread during a `git stash` burst. Using libgit2 cuts
# each operation to ~10-50 ms.
git2 = { version = "0.19", default-features = false, features = ["vendored-libgit2"] }
font-kit = "0.14"
ignore = "0.4"
regex = "1"
tiny_http = "0.12"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# System metrics (CPU + memory) for the status bar's app-usage readout.
# `app_metrics.rs` samples the whole Abundio process tree on a background
# thread and pushes an `app-metrics` event to the frontend. Only the `system`
# feature is needed (processes + CPU); disk/network/component are excluded.
sysinfo = { version = "0.33", default-features = false, features = ["system"] }

[dev-dependencies]
tempfile = "3"
