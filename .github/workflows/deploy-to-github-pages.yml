name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:   # lets you trigger manually too

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment, don't cancel in-progress runs
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # --- your build goes here ---
      # - name: Setup Node
      #  uses: actions/setup-node@v4
      #  with:
      #    node-version: 20
      #- name: Install and build
      #  run: |
      #    npm ci
      #    npm run build
      # ----------------------------

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./www   # <-- point this at YOUR build output folder

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
