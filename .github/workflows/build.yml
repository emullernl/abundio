name: Build

on:
  push:
    tags:
      - 'v*'

jobs:
  # The app bundles the servers a Host runs (phase 15), so they are built
  # first, by the `server` job below.
  build:
    needs: server
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: ""
            rust-targets: ""
          - platform: windows-latest
            args: ""
            rust-targets: ""

    permissions:
      contents: write
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable branch, 2026-11
        with:
          toolchain: stable
          targets: ${{ matrix.rust-targets }}

      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      # Every installer carries all three servers, gzipped, in its resources
      # (`bundle.resources`); a Host unpacks the one it needs.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: abundio-server-*
          path: server-dist
          merge-multiple: true

      - name: Bundle the servers
        shell: bash
        run: |
          for p in linux-x86_64 linux-aarch64 macos-universal; do
            test -s "server-dist/abundio-server-$p" || { echo "missing server for $p" >&2; exit 1; }
            gzip -9 -n -c "server-dist/abundio-server-$p" > "src-tauri/resources/server/abundio-server-$p.gz"
          done
          ls -l src-tauri/resources/server

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # action-v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Tauri updater signing — signs the bundle + generates latest.json
          # (bundle.createUpdaterArtifacts is enabled in tauri.conf.json). The
          # private key + password are repo secrets; the matching public key is
          # committed in tauri.conf.json under plugins.updater.pubkey. See ADR-0014.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: ${{ matrix.args }}
          tagName: ${{ github.ref_name }}
          releaseName: "Abundio v__VERSION__"
          releaseDraft: true
          prerelease: false

  # The headless server a Host runs (docs/plans/remote-hosts.md phase 8e):
  # built for each Host platform and handed to the `build` job, which
  # bundles all three into every installer (phase 15), and attached to the
  # release as downloads of their own (`server-assets`).
  server:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            runner: ubuntu-24.04
          - platform: linux-aarch64
            runner: ubuntu-24.04-arm
          - platform: macos-universal
            runner: macos-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Static (musl), in the same Alpine container as a development build.
      - name: Build (Linux)
        if: startsWith(matrix.platform, 'linux-')
        run: |
          sh scripts/build-server-linux.sh "${MATRIX_PLATFORM#linux-}"
          cp "src-tauri/target/server-dist/$MATRIX_PLATFORM/abundio-server" "abundio-server-$MATRIX_PLATFORM"
        env:
          MATRIX_PLATFORM: ${{ matrix.platform }}

      - name: Setup Rust (macOS)
        if: matrix.platform == 'macos-universal'
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable branch, 2026-11
        with:
          toolchain: stable
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Build (macOS universal)
        if: matrix.platform == 'macos-universal'
        working-directory: src-tauri
        run: |
          for t in aarch64-apple-darwin x86_64-apple-darwin; do
            cargo build --release --locked -p abundio-server --target "$t"
          done
          lipo -create -output ../abundio-server-macos-universal \
            target/aarch64-apple-darwin/release/abundio-server \
            target/x86_64-apple-darwin/release/abundio-server

      # The handshake needs the exact version: never ship another one.
      - name: Check its version
        run: |
          got="$(./abundio-server-$MATRIX_PLATFORM version)"
          want="abundio-server ${GITHUB_REF_NAME#v}"
          echo "$got"
          [ "$got" = "$want" ] || { echo "expected $want" >&2; exit 1; }
        env:
          MATRIX_PLATFORM: ${{ matrix.platform }}

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: abundio-server-${{ matrix.platform }}
          path: abundio-server-${{ matrix.platform }}
          if-no-files-found: error

  # The servers as downloads of their own, beside the app, for installing one
  # by hand. The app never fetches them: it bundles its own (phase 15). The
  # release must exist first, so after `build`, which makes it (as a draft).
  server-assets:
    needs: [build, server]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: abundio-server-*
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum abundio-server-* > SHA256SUMS && cat SHA256SUMS

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" dist/* --clobber --repo "$GITHUB_REPOSITORY"
